<!doctype html>
<html lang="%sveltekit.language%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover" />
		<meta name="theme-color" content="#f60" />
		<meta name="google-site-verification" content="2JPOOgxLf9FGCZp7dVmKlXxzWf3mHwsBM9SIvUnf9l0" />
		<meta name="msvalidate.01" content="" />

		<!-- Preconnect to external APIs -->
		<link rel="preconnect" href="https://api.open-meteo.com" crossorigin />

		<!-- Inter - self-hosted, preloaded so text renders in Inter from the first paint (no font flash).
		     @font-face lives in global.css; Cyrillic is preloaded only on RU pages (+layout.svelte). -->
		<link rel="preload" as="font" type="font/woff2" href="%sveltekit.assets%/fonts/inter/inter-latin.woff2" crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="%sveltekit.assets%/fonts/inter/inter-latin-ext-a.woff2" crossorigin />

		<!-- Favicons & App Icons -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/images/logo-pristav.svg" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/images/logo-pristav.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/images/logo-pristav.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
